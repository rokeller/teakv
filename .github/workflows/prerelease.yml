name: PreRelease

on:
  release:
    types: [prereleased]

env:
  DOTNET_VERSIONS: |
    10.0.x
    11.0.x

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          dotnet restore TeaSuite.KV.slnx
          dotnet restore Examples.slnx

      - name: Build
        run: |
          dotnet build TeaSuite.KV.slnx --no-restore --configuration Release
          dotnet build Examples.slnx --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test TeaSuite.KV.slnx \
            --configuration Release \
            --no-build \
            --coverlet \
            --results-directory TestResults/Temp

      - name: Install report generator
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate report
        if: ${{ !cancelled() }}
        run: |
          reportgenerator \
            -reports:'TestResults/Temp/coverage.cobertura*.xml' \
            -targetdir:coverage \
            -reporttypes:'Html_Dark;MarkdownSummaryGithub'

      - name: Write to Job Summary
        if: ${{ !cancelled() }}
        run: cat coverage/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this to use for Nuget publishing

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      - name: Get version
        # Extract the version from the pre-release tag.
        run: |
          TAG_NAME=$GITHUB_REF_NAME
          VERSION=$(echo $TAG_NAME | sed -r 's/^v?([0-9.]+-.+)$/\1/')
          echo "Version=$VERSION" >> $GITHUB_ENV

      - name: Create NuGet Package
        run: |
          dotnet pack TeaSuite.KV.slnx --configuration Release --output packages/

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # Nuget Org/Owner

      - name: Publish NuGet Package
        run: |
          dotnet nuget push packages/*.nupkg \
            -s https://api.nuget.org/v3/index.json \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}}
